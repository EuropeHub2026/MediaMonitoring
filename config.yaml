# Serbia Post-Election Monitor: settings shared by every script.
# Secrets never go here; they come from the environment (Codespaces secrets or .env) via config.py.
# This file is public. Do not put anything in it that assumes secrecy.

project:
  name: Serbia Post-Election Monitor
  user_agent_name: SerbiaPostElectionMonitor/0.1
  repo_url: https://github.com/EuropeHub2026/MediaMonitoring
  # Shown in the User-Agent and as the takedown contact in the method notes.
  # Collectors refuse to run while this is still the placeholder.
  contact_email: hoplizo@proton.me

timezone: Europe/Belgrade

schedule:
  collect_at: "06:00"
  draft_ready_by: "07:30"
  publish_by: "09:00"
  # Collection runs every day; briefs only on these days. Monday covers since Friday's brief.
  brief_weekdays: [mon, tue, wed, thu, fri]

paths:
  data_dir: data
  review_dir: review
  exports_dir: exports
  docs_dir: docs
  web_template: web/index.html
  validation_dir: data/validation
  outlets_csv: outlets.csv
  actors_csv: actors.csv
  links_csv: data/links.csv
  articles_csv: data/articles.csv
  coded_jsonl: data/coded.jsonl
  coding_check_md: data/coding_check.md
  trackers_json: data/trackers.json
  triage_csv: data/triage.csv
  status_json: data/status.json
  log_dir: data/logs

# The fixed outlet groups (CLAUDE.md, Scope decisions). outlets.csv may only use these.
# primary_nonstate: party, union and association sites; collected but never counted
# towards severity (codebook.NON_CORROBORATING_GROUPS).
outlet_groups: [official, serbian_independent, serbian_pro_government, international, aggregator, primary_nonstate]

languages:
  active: [sr, en]
  later: [fr, de]   # stage 4, via Google News editions

http:
  min_seconds_between_requests_per_domain: 2
  timeout_seconds: 20
  # Never retry on 403 or 429 (CLAUDE.md, Hard rules). Only transient server errors are retried.
  retry_statuses: [500, 502, 503, 504]
  max_retries: 2

collection:
  # Fallback window when there is no previous brief to measure "since the last brief" from.
  default_lookback_hours: 26
  google_news:
    editions:
      en: {hl: en-US, gl: US, ceid: "US:en"}
      sr: {hl: sr, gl: RS, ceid: "RS:sr"}
    # Keyword searches per language, run in addition to per-outlet site: queries.
    queries:
      en:
        - Serbia government
        - Serbia election
        - Serbia Student List
        - Belgrade resignation
        - Serbia prosecutor
      sr:
        - Studentska lista
        - ostavka
        - smena direktora
        - RIK izbori
        - Vlada Srbije
        - тужилаштво
  # Applied to outlets with needs_keyword_filter = yes (broad international feeds).
  serbia_keywords: [Serbia, Serbian, Belgrade, Vučić, Vucic, Novi Sad, Srbija, Beograd]

grouping:
  title_similarity_threshold: 85   # rapidfuzz token_sort_ratio on Latin-script keys, 0-100
  window_hours: 48
  min_title_words: 4   # shorter titles (e.g. "Saopštenje") are never grouped

coding:
  model_env: OPENAI_MODEL
  brief_model_env: OPENAI_MODEL_BRIEF
  max_text_chars: 12000
  temperature: null   # leave null for models that reject it; set e.g. 0 if the model accepts it
  max_stories_per_run: 400   # soft guard on spend; the hard cap is the provider budget alert
  # Stories are coded most-reported first, so the cap drops the least-reported ones.
  thread_window_days: 10       # a story can join a thread whose latest story is this recent
  thread_min_score: 2          # shared entity = 2 points, shared actor = 1 point
  # Broad actors that appear in most stories and say nothing about which issue it is.
  thread_ignore_actors: [student_list, students_in_blockade, sns, united_serbia, government, national_assembly]

triage:
  model_env: OPENAI_MODEL
  batch_size: 60

extract:
  max_copies_per_story: 2     # text is fetched for the best copies only; all copies still count for reach
  min_text_chars: 400         # shorter extracted text is marked partial
  max_html_bytes: 3000000

trackers:
  emerging_window_days: 7   # emerging leaders: stories in the last N days against the N before

brief:
  min_items: 5
  max_items: 8
  max_input_developments: 60   # the most severe and widely reported go to the model
  focus_max_items: 12
  # Catch-up section after a pause in briefing (4_draft_brief.py --catch-up-from).
  catch_up_min_items: 3
  catch_up_max_items: 5

# Shown in the method notes on the page. This file is public.
method:
  validation: "Not yet validated. Formal validation against reviewer hand-coding is planned; until then every brief is checked by a team reviewer before publication."
  known_gaps:
    - "AP, Reuters, Tanjug and Bloomberg are represented by headlines only."
    - "Paywalled articles are represented by their free text."
    - "Coverage of 31 October 2026 is thinner than other days."
    - "No briefs were published from 4 to 6 November 2026, and collection paused from 5 to 8 November. Briefs restarted with the window from Monday 9 November. Stories from the pause were collected on 10 November from what news feeds and searches still carried, so coverage of 5 to 8 November is thinner than other days and some stories from it may be missing."
    - "Only the most widely reported stories are coded each day."

# Stage 4 and 5. Collectors read accounts and pages from these lists only.
social:
  enabled: false
  x_accounts: []
  x_daily_keyword_search: ""
  youtube_channels: []
  telegram_channels: []
  facebook_pages: []

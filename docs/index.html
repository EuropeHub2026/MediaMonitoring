<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Serbia Post-Election Monitor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --ground: #eef2f4; --surface: #fff; --ink: #15252e; --muted: #566b76; --line: #cfd9de;
  --accent: #0f5e73; --sev3: #b3261e; --sev2: #a85d00; --sev1: #566b76;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --ground: #0f1a20; --surface: #17252c; --ink: #e6eef1; --muted: #9db0ba;
    --line: #2d414b; --accent: #6cc3da; --sev3: #ff8f85; --sev2: #f0b35a; --sev1: #9db0ba; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body); padding: 28px 16px 56px; }
main { max-width: 780px; margin-inline: auto; display: grid; gap: 30px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; font-weight: 500; }
p { margin: 0; } a { color: var(--accent); }
.stamp { font: .78rem var(--data); color: var(--muted); }
header, section, article { display: grid; gap: 10px; }
header { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.notice { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; }
.focus { background: var(--surface); border: 1px solid var(--line); padding: clamp(14px, 3vw, 22px); }
.focus ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.focus li { display: grid; grid-template-columns: 4.4em 1fr; gap: 12px; align-items: baseline; }
.focus li > div { display: grid; gap: 3px; min-width: 0; }
.sev { font: 500 .74rem var(--data); border: 1px solid currentColor; padding: 1px 5px; text-align: center; }
.s3 { color: var(--sev3); } .s2 { color: var(--sev2); } .s1 { color: var(--sev1); }
article { padding-top: 16px; border-top: 1px solid var(--line); }
.why b { font-weight: 600; }
.src { font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 6px 8px; max-width: 100%; }
label { font-size: .88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
dl { margin: 0; display: grid; gap: 8px; } dt { font-weight: 600; } dd { margin: 0; color: var(--muted); }
.tracker { display: grid; gap: 14px; }
.tracker > p.note { font-size: .88rem; color: var(--muted); }
.entry { display: grid; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
.entry h3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.entry .meta { font: .78rem var(--data); color: var(--muted); }
.tag { font: 500 .72rem var(--data); color: var(--muted); border: 1px solid var(--line); padding: 0 5px; }
.group-title { font: 600 .8rem var(--data); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 6px; }
details summary { cursor: pointer; font-size: .86rem; color: var(--accent); }
details ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: .86rem; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { font: 500 .74rem var(--data); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-top: 0; }
td.num { font-family: var(--data); text-align: right; white-space: nowrap; }
.role { display: block; font-size: .8rem; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.filters label { flex: 1 1 150px; flex-direction: column; align-items: stretch; gap: 3px; }
.filters label.search { flex-basis: 100%; }
input[type=search] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 6px 8px; width: 100%; }
.filters select { width: 100%; }
.count { font: .8rem var(--data); color: var(--muted); }
.item { display: grid; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
.item h3 { font-family: var(--body); font-weight: 500; font-size: 1rem; overflow-wrap: anywhere; }
.item .tags { display: flex; flex-wrap: wrap; gap: 6px; }
button.more { font: inherit; color: var(--accent); background: var(--surface); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; justify-self: start; }
dd ul { margin: 4px 0 0; padding-left: 18px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main id="app"><h1>Serbia Post-Election Monitor</h1><p>This page needs its data file.</p></main>
<script src="data.js"></script>
<script>
(function () {
  var data = window.SITE_DATA;
  var app = document.getElementById("app");
  if (!data || !data.briefs || !data.briefs.length) return;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function sourcesLine(list) {
    var line = el("p", "src", "Sources: ");
    list.filter(function (s) { return /^https?:\/\//.test(s.url); }).forEach(function (s, i) {
      if (i) line.append(" · ");
      var a = el("a", "", s.name);
      a.href = s.url; a.rel = "noopener noreferrer"; a.target = "_blank";
      line.append(a);
    });
    return line;
  }
  function today() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: data.timezone }).format(new Date());
  }
  function longDate(iso) {
    return new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB",
      { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  }
  function label(category) { return category.replace(/_/g, " "); }

  function focusPanel(brief) {
    var box = el("section", "focus");
    box.append(el("h2", "", "Alert focus box"));
    if (!brief.focus.length) { box.append(el("p", "", "No alert items since the previous brief.")); return box; }
    var list = el("ul");
    brief.focus.forEach(function (item) {
      var row = el("li"), body = el("div");
      row.append(el("span", "sev s" + item.severity, "SEV " + item.severity));
      body.append(el("p", "", item.text), el("p", "src", item.categories.map(label).join(", ")), sourcesLine(item.sources));
      row.append(body); list.append(row);
    });
    box.append(list);
    return box;
  }
  function briefPanel(brief) {
    var section = el("section");
    section.append(el("h2", "", "Daily brief"));
    brief.items.forEach(function (item) {
      var art = el("article");
      art.append(el("h3", "", item.headline));
      item.paragraphs.forEach(function (p) { art.append(el("p", "", p)); });
      var why = el("p", "why"); why.append(el("b", "", "Why it matters: "), item.why);
      art.append(why, sourcesLine(item.sources));
      section.append(art);
    });
    return section;
  }
  function catchUpPanel(brief) {
    var c = brief.catch_up, section = el("section");
    section.append(el("h2", "", "Catch-up"),
      el("p", "src", "Developments from " + shortDate(c.start) + " to " + shortDate(c.end) +
        ", when no brief was published. Coverage of this period is incomplete; see known gaps in the method notes."));
    c.items.forEach(function (item) {
      var art = el("article");
      art.append(el("h3", "", item.headline));
      item.paragraphs.forEach(function (p) { art.append(el("p", "", p)); });
      var why = el("p", "why"); why.append(el("b", "", "Why it matters: "), item.why);
      art.append(why, sourcesLine(item.sources));
      section.append(art);
    });
    return section;
  }
  var T = data.trackers;
  function shortDate(iso) {
    return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: data.timezone });
  }
  function link(src) {
    var a = el("a", "", src.outlet);
    a.href = src.url; a.rel = "noopener noreferrer"; a.target = "_blank";
    return a;
  }
  function trailLine(list, max) {
    var line = el("p", "src", "Sources: ");
    list.filter(function (s) { return /^https?:\/\//.test(s.url); }).slice(0, max).forEach(function (s, i) {
      if (i) line.append(" · ");
      line.append(link(s));
    });
    if (list.length > max) line.append(" · and " + (list.length - max) + " more");
    return line;
  }
  function trackerHead(title, intro) {
    var section = el("section", "tracker");
    section.append(el("h2", "", title), el("p", "note", intro));
    return section;
  }
  function mixed(list) {
    return list.some(function (e) { return e.unconfirmed; }) && list.some(function (e) { return !e.unconfirmed; });
  }
  function unconfirmedNote(section, list) {
    if (!list.some(function (e) { return e.unconfirmed; })) return;
    section.append(el("p", "note", mixed(list)
      ? "Names marked “unconfirmed” come from the starting actor list, which a reviewer has not yet signed off."
      : "Names come from the starting actor list, which a reviewer has not yet signed off."));
  }
  function nameHeading(entry, sev, list) {
    var h = el("h3", "", entry.name);
    if (sev) h.append(el("span", "sev s" + sev, "SEV " + sev));
    if (entry.unconfirmed && mixed(list)) h.append(el("span", "tag", "unconfirmed"));
    return h;
  }
  var ACTION = { called_to_resign: "called to resign", dismissal_demanded: "dismissal demanded",
    resigned: "resigned", dismissed: "dismissed", suspended: "suspended" };
  var STATUS = [["gone", "Gone"], ["suspended", "Suspended"], ["departure_announced", "Departure announced"],
    ["called_to_resign", "Called to resign or dismissal demanded"]];

  function timelinePanel() {
    if (!T.transition_timeline.length) return null;
    var section = trackerHead("Transition timeline",
      "Milestones in the transfer of power, newest first. Severity is computed across every outlet that reported the milestone.");
    T.transition_timeline.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (m) {
      var entry = el("div", "entry"), h = el("h3", "", shortDate(m.date));
      h.append(el("span", "sev s" + m.severity, "SEV " + m.severity));
      if (m.announced_only) h.append(el("span", "tag", "announced, not yet done"));
      var why = el("p", "why"); why.append(el("b", "", "Why it matters: "), m.why_it_matters);
      entry.append(h, el("p", "", m.summary), why, trailLine(m.sources, 4));
      section.append(entry);
    });
    return section;
  }
  function resignationPanel() {
    if (!T.resignations.length) return null;
    var section = trackerHead("Resignation and dismissal tracker",
      "People and bodies publicly called to resign or reported as having gone, with who made the call. Recorded as the press reported them.");
    unconfirmedNote(section, T.resignations);
    STATUS.forEach(function (st) {
      var group = T.resignations.filter(function (e) { return e.status === st[0]; });
      if (!group.length) return;
      section.append(el("p", "group-title", st[1]));
      group.forEach(function (e) {
        var entry = el("div", "entry"), last = e.events[e.events.length - 1];
        entry.append(nameHeading(e, e.max_severity, T.resignations), el("p", "meta", e.role));
        if (e.called_by.length) entry.append(el("p", "", "Called for by: " + e.called_by.join("; ")));
        var details = el("details"), list = el("ul");
        details.append(el("summary", "", e.events.length + " report" + (e.events.length > 1 ? "s" : "") + ", latest " + shortDate(last.published)));
        e.events.slice().reverse().forEach(function (ev) {
          var li = el("li"), parts = [shortDate(ev.published), ACTION[ev.action] || ev.action];
          if (ev.stage === "announced") parts.push("announced");
          if (ev.by_whom) parts.push("by " + ev.by_whom);
          li.append(parts.join(" · ") + " · ", link(ev));
          if (ev.response) li.append(el("span", "role", "Response: " + ev.response));
          list.append(li);
        });
        details.append(list); entry.append(details);
        section.append(entry);
      });
    });
    return section;
  }
  function tone(e) {
    if (e.mean_stance === null || e.stance_rows < 5) return "too few reports";
    var v = e.mean_stance;
    return (v <= -1 ? "mostly critical" : v < -0.3 ? "leaning critical" : v < 0.3 ? "mixed or neutral" : v < 1 ? "leaning favourable" : "mostly favourable") + " (" + v.toFixed(1) + ")";
  }
  function leadersPanel() {
    if (!T.emerging_leaders.length) return null;
    var hasPrior = T.emerging_leaders.some(function (e) { return e.stories_prior > 0; });
    var section = trackerHead("Emerging leaders",
      "People ranked by growth in coverage over the last " + T.window_days + " days against the " + T.window_days + " before. Tone is the average stance of reports towards the person, from −2 to +2." +
      (hasPrior ? "" : " Collection began recently, so there is no earlier period yet and the ranking shows coverage only; incumbents appear alongside newcomers."));
    unconfirmedNote(section, T.emerging_leaders);
    var table = el("table"), head = el("tr");
    ["Name", "Stories", "Before", "Tone"].forEach(function (t) { head.append(el("th", "", t)); });
    table.append(head);
    T.emerging_leaders.slice(0, 12).forEach(function (e) {
      var row = el("tr"), name = el("td", "", e.name);
      if (e.unconfirmed && mixed(T.emerging_leaders)) { name.append(" "); name.append(el("span", "tag", "unconfirmed")); }
      name.append(el("span", "role", e.role));
      row.append(name, el("td", "num", String(e.stories_recent)), el("td", "num", String(e.stories_prior)), el("td", "", tone(e)));
      table.append(row);
    });
    section.append(table);
    return section;
  }
  function trackerPanels() {
    if (!T) return [];
    return [timelinePanel(), resignationPanel(), leadersPanel()].filter(Boolean);
  }
  var A = data.articles || [];
  function options(select, all, values, fmt) {
    var first = el("option", "", all); first.value = ""; select.append(first);
    values.forEach(function (v) { var o = el("option", "", fmt ? fmt(v) : v); o.value = v; select.append(o); });
  }
  function uniq(get) {
    var seen = {};
    A.forEach(function (a) { [].concat(get(a)).forEach(function (v) { seen[v] = true; }); });
    return Object.keys(seen);
  }
  function dayOf(iso) {
    return new Intl.DateTimeFormat("en-CA", { timeZone: data.timezone }).format(new Date(iso));
  }
  function articlePanel() {
    if (!A.length) return null;
    var section = el("section", "tracker"), PAGE = 25, shown = PAGE;
    section.append(el("h2", "", "Article list"),
      el("p", "note", "Every story coded as relevant, up to the end of the latest approved brief, newest first. Headline, AI summary and link only; the link goes to one copy of the story. Severity is computed across every outlet that reported the event."));
    var filters = el("div", "filters");
    function field(text, control, cls) { var l = el("label", cls || "", text); l.append(control); filters.append(l); return control; }
    var q = field("Search headlines and summaries", el("input"), "search");
    q.type = "search";
    var cat = field("Category", el("select")), actor = field("Actor", el("select")),
        group = field("Outlet group", el("select")), day = field("Date", el("select"));
    options(cat, "All categories", uniq(function (a) { return a.categories; }).sort(), label);
    options(actor, "All actors", uniq(function (a) { return a.actors; }).sort(function (x, y) { return x.localeCompare(y); }));
    options(group, "All outlet groups", uniq(function (a) { return a.outlet_groups; }).sort(), label);
    options(day, "All dates", uniq(function (a) { return dayOf(a.published); }).sort().reverse(),
      function (d) { return longDate(d); });
    var count = el("p", "count"), list = el("div", "tracker"), more = el("button", "more", "Show more");
    more.type = "button";
    section.append(filters, count, list, more);
    function matches(a) {
      var text = q.value.trim().toLowerCase();
      return (!text || (a.title + " " + a.summary).toLowerCase().indexOf(text) >= 0) &&
        (!cat.value || a.categories.indexOf(cat.value) >= 0) &&
        (!actor.value || a.actors.indexOf(actor.value) >= 0) &&
        (!group.value || a.outlet_groups.indexOf(group.value) >= 0) &&
        (!day.value || dayOf(a.published) === day.value);
    }
    function render() {
      var hits = A.filter(matches);
      count.textContent = hits.length + " of " + A.length + " stories";
      list.replaceChildren();
      hits.slice(0, shown).forEach(function (a) {
        var item = el("div", "item"), h = el("h3"), link = el("a", "", a.title);
        link.href = a.url; link.rel = "noopener noreferrer"; link.target = "_blank";
        h.append(link);
        var meta = el("p", "meta src", shortDate(a.published) + " · " + a.outlet +
          (a.n_copies > 1 ? " · " + a.n_copies + " copies" : "") + " · ");
        meta.append(el("span", "sev s" + a.severity, "SEV " + a.severity));
        var tags = el("p", "tags");
        a.categories.forEach(function (c) { tags.append(el("span", "tag", label(c))); });
        item.append(h, meta, el("p", "", a.summary), tags);
        if (a.actors.length) item.append(el("p", "src", "Actors: " + a.actors.join(", ")));
        list.append(item);
      });
      if (!hits.length) list.append(el("p", "note", "No stories match these filters."));
      more.hidden = hits.length <= shown;
    }
    [q, cat, actor, group, day].forEach(function (c) {
      c.addEventListener(c === q ? "input" : "change", function () { shown = PAGE; render(); });
    });
    more.addEventListener("click", function () { shown += PAGE * 2; render(); });
    render();
    return section;
  }
  function methodPanel() {
    var m = data.method, section = el("section"), dl = el("dl");
    section.append(el("h2", "", "Method notes"));
    function add(term, content) {
      var dd = el("dd");
      if (typeof content === "string") dd.textContent = content; else dd.append(content);
      dl.append(el("dt", "", term), dd);
    }
    function bullets(items) {
      var ul = el("ul");
      items.forEach(function (i) { ul.append(el("li", "", i)); });
      return ul;
    }
    add("How this is made", "Serbian and international press reports are collected every morning from news feeds, sitemaps and Google News. Headlines are screened, relevant stories are coded by AI against a fixed codebook, and a brief is drafted. A team reviewer checks and approves every brief before it appears here. Copies of one story are grouped, and stories about the same event are joined.");
    var src = el("div");
    src.append(Object.keys(m.outlets_by_group).map(function (g) { return label(g) + ": " + m.outlets_by_group[g]; }).join("; "));
    if (m.outlet_names) {
      var det = el("details"), ul = el("ul");
      det.append(el("summary", "", "List of outlets"));
      Object.keys(m.outlet_names).forEach(function (g) { ul.append(el("li", "", label(g) + ": " + m.outlet_names[g].join(", "))); });
      det.append(ul); src.append(det);
    }
    add("Sources", src);
    add("Primary non-state sources", "Sites of parties, unions and associations (e.g. the Student List and UNS) are collected and linked but never count towards severity: they speak for themselves rather than corroborate.");
    add("Severity", "Computed by script per event, across every outlet that reported it. 1: reported by one outlet group. 2: two or more groups, or an official outlet. 3: meets 2 and involves a top-tier post (ministers, acting president, Speaker, police, BIA, chief prosecutors, RIK, REM, RTS, NBS governor, heads of state companies).");
    add("Codebook", "Version " + m.codebook_version + ", prompt " + m.prompt_version + ". AI summaries are in English; article text and quotes are never published here.");
    if (T) add("Trackers", "Built from the people, bodies and actions coded in each story, up to the end of the latest approved brief (" + shortDate(T.cutoff) + "). Accusations and calls to resign are attributed; a reported response is shown when there is one.");
    add("Validation", m.validation);
    add("Known gaps", bullets(m.known_gaps));
    m.service_notes.forEach(function (n) { add("Service notice", n); });
    var mail = el("a", "", m.takedown_contact); mail.href = "mailto:" + m.takedown_contact;
    var take = el("span", "", "Public figures and public roles only. To ask for a correction or removal, write to ");
    take.append(mail, ".");
    add("Corrections and takedown", take);
    section.append(dl);
    return section;
  }
  function show(brief) {
    var head = el("header");
    head.append(el("h1", "", "Serbia Post-Election Monitor"),
      el("p", "stamp", "Brief for " + longDate(brief.date) + " · reviewed by " + brief.reviewed_by));
    var nodes = [head];
    if (brief === data.briefs[0] && brief.date !== today()) {
      nodes.push(el("p", "notice", "No brief today. The latest approved brief is shown below."));
    }
    if (data.briefs.length > 1) {
      var pick = el("label", "", "Earlier briefs"), select = el("select");
      select.id = "brief-date";
      data.briefs.forEach(function (b, i) {
        var opt = el("option", "", longDate(b.date)); opt.value = String(i);
        opt.selected = b === brief; select.append(opt);
      });
      select.addEventListener("change", function () { show(data.briefs[+select.value]); });
      pick.append(select); nodes.push(pick);
    }
    nodes.push(focusPanel(brief), briefPanel(brief));
    if (brief.catch_up && brief.catch_up.items.length) nodes.push(catchUpPanel(brief));
    nodes.push.apply(nodes, trackerPanels());
    var articles = articlePanel();
    if (articles) nodes.push(articles);
    nodes.push(methodPanel());
    app.replaceChildren.apply(app, nodes);
  }
  show(data.briefs[0]);
})();
</script>
</body>
</html>
